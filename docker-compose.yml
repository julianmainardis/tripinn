services:
  postgres:
    image: postgres:17-alpine
    container_name: tripinn-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripinn
    ports:
      - "5432:5432"
    volumes:
      - tripinn_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  tripinn_postgres_data:
